services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    # El proxy nginx de borde (proyecto `proxy`) lo alcanza por nombre `app` en la red edge.
    # El TLS, los headers y el ruteo por dominio ahora viven en ese proxy (antes: Caddy local).
    networks: [edge]

networks:
  # Red compartida del proxy de borde. Se crea una vez en el VPS: docker network create edge
  edge:
    external: true
    name: edge
