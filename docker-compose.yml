services:
  portfolio-app:
    container_name: portfolio-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    # El proxy nginx de borde lo alcanza por nombre `portfolio-app` en la red edge.
    networks:
      edge:
        aliases:
          - portfolio-app

networks:
  # Red compartida del proxy de borde. Se crea una vez en el VPS: docker network create edge
  edge:
    external: true
    name: edge
